name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    # O job chamado pede estas permissões (Windows flutter: contents/id-token/attestations/
    # artifact-metadata); sem concedê-las aqui o run morre em startup_failure. Com
    # upload-artifact: false nenhum passo de release/atestação roda.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false

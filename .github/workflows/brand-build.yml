name: Brand Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Release tag name"
        required: false
        default: "nightly"
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"

jobs:
  run-brand-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || github.event.inputs.upload-tag || 'nightly' }}
      publish-update-metadata: false


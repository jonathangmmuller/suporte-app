name: Brand Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag do release (ex: v1.0.0-vancin)"
        required: false
        default: "nightly"
      somente-entrada:
        description: "Build de cliente (só recebe acesso, sem conectar em outras máquinas)"
        type: boolean
        default: false
      bancada:
        description: "Bancada: só Windows + testes Rust + pausas por fase; gera só artefato do Actions (nenhuma release/tag)"
        type: boolean
        default: false
      versao-bancada:
        description: "Bancada: versão x.y.z gravada no binário (obrigatória com bancada; maior que a última publicada)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # A variante vem da tag (`-cliente` = só entrada). O input tem de concordar, senão nada é
  # compilado: evita assinar como cliente uma build de gerência (e vice-versa).
  conferir-variante:
    runs-on: ubuntu-latest
    steps:
      - name: Tag e somente-entrada coerentes
        shell: bash
        env:
          TAG: ${{ inputs.upload-tag }}
          SOMENTE_ENTRADA: ${{ inputs.somente-entrada }}
          DA_TAG: ${{ endsWith(inputs.upload-tag, '-cliente') }}
          BANCADA: ${{ inputs.bancada }}
          VERSAO_BANCADA: ${{ inputs.versao-bancada }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bancada não publica: só a tag nightly, que nem chega a ser tocada (UPLOAD_ARTIFACT=false).
          if [ "$BANCADA" = true ] && [ "$TAG" != nightly ]; then
            echo "::error::bancada só com upload-tag=nightly (nada é publicado): $TAG"; exit 1
          fi
          # Bancada: versão explícita, senão o binário sai sem identidade e usa o atualizador
          # antigo. Maior que a última publicada (qualquer marca/variante), para exercitar a troca.
          if [ "$BANCADA" = true ]; then
            if ! [[ "$VERSAO_BANCADA" =~ ^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$ ]]; then
              echo "::error::bancada exige versao-bancada x.y.z: '$VERSAO_BANCADA'"; exit 1
            fi
            ULTIMA=$(gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-(vancin|talkincloud)(-cliente)?$/\1/p' \
              | sort -V | tail -n 1)
            if [ -z "$ULTIMA" ]; then
              echo "::error::nenhuma release v<x.y.z>-<marca> encontrada para comparar"; exit 1
            fi
            if [ "$VERSAO_BANCADA" = "$ULTIMA" ] \
              || [ "$(printf '%s\n%s\n' "$ULTIMA" "$VERSAO_BANCADA" | sort -V | tail -n 1)" != "$VERSAO_BANCADA" ]; then
              echo "::error::versao-bancada $VERSAO_BANCADA não é maior que a última publicada ($ULTIMA)"; exit 1
            fi
            echo "bancada: versão $VERSAO_BANCADA (última publicada: $ULTIMA)"
          elif [ -n "$VERSAO_BANCADA" ]; then
            echo "::error::versao-bancada só vale com bancada=true"; exit 1
          fi
          if [ "$TAG" != nightly ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(vancin|talkincloud)(-cliente)?$ ]]; then
            echo "::error::tag fora do formato v<x.y.z>-<marca>[-cliente]: $TAG"; exit 1
          fi
          if [ "$SOMENTE_ENTRADA" != "$DA_TAG" ]; then
            echo "::error::tag '$TAG' pede somente-entrada=$DA_TAG, mas o input veio $SOMENTE_ENTRADA"; exit 1
          fi
          echo "tag $TAG: somente-entrada=$DA_TAG"

  build:
    needs: conferir-variante
    # atestação de procedência (Sigstore): só este job recebe OIDC; o job chamado
    # não pode ter mais permissão do que o chamador concede aqui
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: ${{ !inputs.bancada }}
      upload-tag: ${{ inputs.upload-tag }}
      publish-update-metadata: false
      somente-entrada: ${{ endsWith(inputs.upload-tag, '-cliente') }}
      bancada: ${{ inputs.bancada }}
      versao-bancada: ${{ inputs.versao-bancada }}

name: Brand Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag do release (ex: v1.0.0-talkincloud)"
        required: false
        default: "nightly"
      somente-entrada:
        description: "Build de cliente (só recebe acesso, sem conectar em outras máquinas)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      publish-update-metadata: false
      somente-entrada: ${{ inputs.somente-entrada }}
